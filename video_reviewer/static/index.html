<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🐾 Scout</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><b>🐾 Scout</b><span>SOP</span><small id="version"></small></div>
        <nav class="rail" id="rail" aria-label="Pipeline"></nav>
        <div class="spacer"></div>
        <div class="manifest" id="manifest" title=""></div>
        <button class="update-btn" id="update" hidden>Update available</button>
        <button class="icon-btn" id="theme" title="Switch theme" aria-label="Switch theme">◐</button>
      </header>
      <main id="view"></main>
      <footer class="dock" id="dock"></footer>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
