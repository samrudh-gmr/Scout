name: Build and publish Scout for macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          text = text.replace('version = "0.2.0"', f'version = "{version}"', 1)
          pyproject.write_text(text)
          init = Path("video_reviewer/__init__.py")
          text = init.read_text()
          text = text.replace('__version__ = "0.2.0"', f'__version__ = "{version}"', 1)
          init.write_text(text)
          PY

      - name: Build Scout.app
        run: ./scripts/build_macos_app.sh

      - name: Create DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          hdiutil create \
            -volname "Scout" \
            -srcfolder "dist/Scout.app" \
            -ov \
            -format UDZO \
            "dist/Scout-${version}-macos-${{ runner.arch }}.dmg"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.dmg

      - name: Upload manual-build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Scout-macos
          path: dist/Scout.app